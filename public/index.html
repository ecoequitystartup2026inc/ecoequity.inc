<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/Eco.png" />
    <!-- viewport-fit=cover lets the layout read env(safe-area-inset-*), so the
         bottom nav and floating buttons clear the home indicator / notch.
         User scaling is deliberately left enabled for accessibility. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f0fdf5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="EcoEquity helps Filipino growers plan, plant and profit — AI crop guidance, a native seed bank, a surplus marketplace, and LGU partnerships for community food security."
    />
    <link rel="canonical" href="%PUBLIC_URL%/" />

    <!-- Social previews. Without these, an EcoEquity link pasted into Messenger
         or Facebook renders as a bare URL with no title, blurb or image.

         og:image and og:url must be ABSOLUTE for crawlers to resolve them.
         %PUBLIC_URL% is rewritten at build time to package.json's "homepage"
         field, so set that to the live origin and these become absolute:
             "homepage": "https://your-live-site.com"
         Until it is set, %PUBLIC_URL% is "" and the previews will not render. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EcoEquity" />
    <meta property="og:title" content="EcoEquity — Grow together, profit together" />
    <meta
      property="og:description"
      content="AI crop guidance, a native seed bank, a surplus marketplace, and LGU partnerships for community food security."
    />
    <meta property="og:image" content="%PUBLIC_URL%/Eco.png" />
    <meta property="og:url" content="%PUBLIC_URL%/" />
    <meta property="og:locale" content="en_PH" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EcoEquity — Grow together, profit together" />
    <meta
      name="twitter:description"
      content="AI crop guidance, a native seed bank, a surplus marketplace, and LGU partnerships for community food security."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/Eco.png" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>EcoEquity.Inc</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
